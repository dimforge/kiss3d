[package]
authors = ["Sébastien Crozet <developer@crozet.re>"]
name    = "kiss3d"
version = "0.46.0"

autoexamples = true
description  = "Keep it simple, stupid, 2D and 3D graphics engine for Rust."
edition      = "2018"
keywords     = ["graphics", "wgpu", "KISS"]
license      = "BSD-3-Clause"
readme       = "README.md"
repository   = "https://github.com/dimforge/kiss3d"

include = [
    "src/**/*.rs",
    "src/**/*.wgsl",
    "src/text/*.ttf",
    "src/builtin/tony_mc_mapface.bin",
    "examples/**/*.rs",
    "examples/media",
    "examples/Cargo.toml",
    "Cargo.toml",
    "/LICENSE",
    "/Readme.md",
]


[lib]
name = "kiss3d"
path = "src/lib.rs"

[features]
# `rfd` powers the inspector's native "Open…" image dialogs (unused on wasm, which
# falls back to a path text field).
egui = ["dep:egui", "dep:egui-wgpu", "dep:rfd"]
recording = ["dep:ffmpeg-the-third"]
serde = ["dep:serde", "glamx/serde", "bitflags/serde", "rgb/serde", "wgpu/serde"]
# If enabled, switching between the ray-tracer and the rasterizer is possible while kipping
# only the `.render_3d` call (instead of having to manually switch between `.render_3d` and
# `.raytrace_3d`. This is mainly for debugging and experiments comparing the rasterizer and
# the raytracer.
rt_switcher = []

[dependencies]
bitflags     = "2"
bytemuck     = { version = "1", features = ["derive"] }
egui         = { version = "0.36", optional = true, default-features = true }
egui-wgpu    = { version = "0.36", optional = true }
gltf         = { version = "1.4", features = ["import", "utils", "names"] }
image        = { version = "0.25", default-features = false, features = ["default-formats"] }
log          = "0.4"
web-time     = "1"
kiss3d-macro = { version = "0.36.0", path = "kiss3d-macro" }
glamx         = { version = "0.3", features = ["bytemuck"] }
ffmpeg-the-third = { version = "4", optional = true }
num-traits   = "0.2"
rgb          = "0.8"
rusttype     = { version = "0.9", features = ["gpu_cache"] }
serde        = { version = "1", features = ["derive"], optional = true }
wgpu         = "30"
winit        = "0.30"
wesl = "0.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1"

# rfd has desktop and wasm backends only; on iOS/Android its dialog traits have
# no implementation and the crate does not compile. The inspector falls back to
# its path text field there, same as on wasm.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios", target_os = "android")))'.dependencies]
rfd = { version = "0.17", optional = true }

# android-activity (under winit) requires the app to pick exactly one glue
# backend and compiles nothing without it. NativeActivity is the pure-Rust
# choice: no Java/Gradle subclass needed.
# 0.6.1 minimum: that release fixed show_soft_input on NativeActivity, which
# `set_keyboard_visible` relies on.
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
android-activity = "0.6.1"

# The on-screen keyboard: winit has no iOS IME support, so `set_keyboard_visible`
# summons UIKit's keyboard itself through a hidden UIKeyInput view (window/ios.rs).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3", features = ["NSValue"] }
objc2-ui-kit = { version = "0.3", features = ["UIApplication", "UIGeometry", "UIResponder", "UIView", "UITextInput", "UIWindow", "objc2-core-foundation"] }

[target.wasm32-unknown-unknown.dependencies]
oneshot = { version = "0.2.0", features = ["async"] }
# We depend on getrandom 0.3 only to enable its wasm_js feature.
# And this is needed only because some dependencies still depend on 0.3.
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.54"
web-sys = { version = "0.3", features = [
    "console",
    "KeyEvent",
    "KeyboardEvent",
    "MouseEvent",
    "WheelEvent",
    "Touch",
    "TouchEvent",
    "TouchList",
    "HtmlCanvasElement",
    "HtmlElement",
    "Navigator",
    "Window",
    "UiEvent",
    "Event",
    "EventTarget",
    "Element",
    "DomRect",
] }

[dev-dependencies]
env_logger = "0.11"
rand       = "0.10"

[patch.crates-io]
#glamx = { path = "../glamx" }