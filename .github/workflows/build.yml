name: CI build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt -- --check
  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Cargo doc
        run: cargo doc
  build-native:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y cmake libxcb-composite0-dev
      - name: Clippy
        run: cargo clippy
      - name: Clippy kiss3d
        run: cargo clippy
      - name: Build kiss3d
        run: cargo build --verbose -p kiss3d;
      - name: Build kiss3d (+ egui)
        run: cargo build --verbose -p kiss3d --features egui;
      # `serde` derives over types the graphics crates own, so it only builds
      # while their own serde features are pulled in with it.
      - name: Build kiss3d (+ serde)
        run: cargo build --verbose -p kiss3d --features serde;
      - name: Build examples (+ egui)
        run: cargo build --verbose --examples --features egui;
      - name: Run tests
        run: cargo test
      # The egui integration (key translation, the command modifier) is behind
      # the feature, so its tests only exist in a build that enables it.
      - name: Run tests (+ egui)
        run: cargo test --features egui
  build-wasm:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - name: build kiss3d
        run: cargo build --verbose --target wasm32-unknown-unknown;
  # Android and iOS have no runner that can execute the result, so CI compiles and
  # links the on-device examples (examples/android, examples/ios). Those are
  # separate workspaces, hence the --manifest-path. Linking, not just checking,
  # is what catches the platform-specific breakages: missing NDK symbols, the
  # objc2 bindings behind the iOS on-screen keyboard, winit's mobile backends.
  build-android:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      # The runners preinstall the NDK; pin cargo-ndk to the newest one they
      # export rather than to whichever version happens to be the default.
      - name: Locate the Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      # cargo-ndk points the linker at the NDK toolchain; a bare cargo build
      # compiles fine but fails to link.
      - name: Build the Android example
        run: cargo ndk --manifest-path examples/android/Cargo.toml --platform 26 -t arm64-v8a build
  build-ios:
    runs-on: macos-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Build the iOS example (device)
        run: cargo build --manifest-path examples/ios/Cargo.toml --target aarch64-apple-ios
      - name: Build the iOS example (simulator)
        run: cargo build --manifest-path examples/ios/Cargo.toml --target aarch64-apple-ios-sim
  # Instantiate every shader variant on a real (software) GPU backend, so any
  # variant that fails to compile on the device is caught. `mesa-vulkan-drivers`
  # provides lavapipe, a software Vulkan device, so the GPU-less runner can create a
  # wgpu device. See `src/shader_validity.rs`.
  shader-validity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake libxcb-composite0-dev mesa-vulkan-drivers vulkan-tools
      - name: Instantiate all shader variants
        run: WGPU_BACKEND=vulkan cargo test --lib shader_validity -- --nocapture
  # If this fails, consider changing your text or adding something to .typos.toml
  # You can find typos here: https://crates.io/crates/typos'
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check typos
        uses: crate-ci/typos@v1.23.2